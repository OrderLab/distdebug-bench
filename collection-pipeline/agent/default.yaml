agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.

    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).
    Include a THOUGHT section before your command where you explain your reasoning process.
    Format your response as shown in <format_example>.

    <format_example>
    Your reasoning and analysis here. Explain why you want to perform the action.

    ```mswea_bash_command
    your_command_here
    ```
    </format_example>

    Failure to follow these rules will cause your response to be rejected.
  instance_template: |
    You are given the following analysis task:

    {{task}}

    ## Recommended Workflow

    This workflow should be done step-by-step to identify the issue from the provided code blocks.

    1. Read each code block listed in the task using `sed -n '<start>,<end>p' <file>` or `nl -ba <file> | sed -n '<start>,<end>p'`
    2. Analyze each block to determine which one(s) contain the root cause of the reported issue
    3. Write your findings as a JSON file to `output/agent/{{issue_id}}-answer.json` (relative to the collection-pipeline directory) using the following schema:
       {
         "issue": "{{issue_id}}",
         "selected_blocks": [
           {
             "file": "<absolute_file_path>",
             "lines": "<start>-<end>",
             "class_function": "<class_or_function_name>",
             "root_cause": "<concise explanation of why this block is the root cause>"
           }
         ]
       }
    4. Submit your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
       Do not combine it with any other command (e.g. `ls -la && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` is not allowed). <important>After this command, you cannot continue working on this task.</important>

    ## Important Rules

    1. Every response must contain exactly one action
    2. The action must be enclosed in triple backticks
    3. Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
       However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## Formatting your response

    Here is an example of a correct response:

    <example_response>
    THOUGHT: I need to read the specified code block to understand the issue.

    ```mswea_bash_command
    nl -ba /path/to/file.java | sed -n '67,96p'
    ```
    </example_response>

    ## Useful command examples

    ### Read specific lines of a file:

    ```mswea_bash_command
    nl -ba filename.java | sed -n '10,20p'
    ```

    ### Write a JSON file:

    ```mswea_bash_command
    cat <<'EOF' > output/agent/ZOOKEEPER-2581.json
    {
      "issue": "ZOOKEEPER-2581",
      "selected_blocks": []
    }
    EOF
    ```

    ### Any other command you want to run

    ```mswea_bash_command
    anything
    ```
  step_limit: 10
  cost_limit: 5.
  output_path: output/agent/ZOOKEEPER-2581_log.json
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
  cwd: /path/to/test/systems/zookeeper
model:
  model_name: openai/gpt-5-mini
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
    If you're using grep or find and it produced too much output, you can use a more selective search pattern.
    If you really need to see something from the full command's output, you can redirect output to a file and then search in that file.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  model_kwargs:
    drop_params: true
  format_error_template: |
    Format error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to format your response:

    Please always provide EXACTLY ONE action in triple backticks, found {{actions|length}} actions.
    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
    Else, please format your response exactly as follows:

    <response_example>
    Here are some thoughts about why you want to perform the action.

    ```mswea_bash_command
    <action>
    ```
    </response_example>

    Note: In rare cases, if you need to reference a similar format in your command, you might have
    to proceed in two steps, first writing TRIPLEBACKTICKSBASH, then replacing them with ```mswea_bash_command.

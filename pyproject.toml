[project]
name = "distdebug-bench"
version = "1.0.0"
description = "DistDebug-Bench: a benchmark of real-world bugs in distributed systems for evaluating LLM debugging agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
agent = ["mini-swe-agent==2.2.8", "pyyaml>=6"]
test = ["pytest>=7.0", "pyyaml>=6"]
release = ["mlcroissant[image,git]>=1.1"]
paper = ["numpy>=1.22", "matplotlib>=3.5", "huggingface_hub>=0.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distdebug_bench"]
